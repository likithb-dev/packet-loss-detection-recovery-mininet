<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker notes</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #070b13; color: #dfe8f3; font: 17px/1.6 Arial, sans-serif; }
  #h { position: sticky; top: 0; display: flex; gap: 10px; align-items: center; background: #0d1421; padding: 10px 18px; border-bottom: 1px solid #27344a; }
  #h b { color: #8fb6ec; font-size: 15px; margin-right: auto; }
  #h button { font: 600 14px Arial; color: #dfe8f3; background: #131c2c; border: 1px solid #27344a; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  #n { white-space: pre-wrap; padding: 14px 18px 60px; }
  #n b { color: #6b9bd8; }
  .nh { display: inline-block; margin-top: 4px; font: 700 13px Arial; letter-spacing: .12em; color: #8fb6ec; }
  .cue { background: #3a2c0c; color: #f2d083; border: 1px solid #6b5420; border-radius: 4px; padding: 0 6px; font-weight: 700; }
  .next { color: #b6d48f; font-weight: 700; } .part { color: #f2d083; font-weight: 700; }
</style>
</head>
<body>
<div id="h"><b id="t">Waiting for the deck… (open it in another tab)</b><button id="p">‹ Prev</button><button id="x">Next ›</button></div>
<div id="n"></div>
<script>
  const ch = new BroadcastChannel('pl-deck');
  ch.onmessage = function (e) {
    if (e.data.type !== 'slide') return;
    document.getElementById('t').textContent = 'Slide ' + (e.data.i + 1) + ' / ' + e.data.total;
    document.getElementById('n').innerHTML = e.data.html;
    window.scrollTo(0, 0);
  };
  ch.postMessage({ type: 'hello' });
  const nav = function (d) { ch.postMessage({ type: 'nav', d: d }); };
  document.getElementById('p').onclick = function () { nav(-1); };
  document.getElementById('x').onclick = function () { nav(1); };
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') nav(1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') nav(-1);
  });
</script>
</body>
</html>
